name: test

on:
  push:
    branches:
      - 'ci-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-integration-host:
    name: "in-host${{ inputs.hack }}"
    uses: $/.github/workflows/job-test-in-host.yml
    strategy:
      fail-fast: false
      matrix:
        include:
          # Test on windows w/o canary
          - runner: windows-2022
            rep: 1
          - runner: windows-2022
            rep: 2
          - runner: windows-2022
            rep: 3
          - runner: windows-2022
            rep: 4
          - runner: windows-2022
            rep: 5
          - runner: windows-2022
            rep: 6
          - runner: windows-2022
            rep: 7
          - runner: windows-2022
            rep: 8
          - runner: windows-2022
            rep: 9
          - runner: windows-2022
            rep: 10
          # FIXME: failing since the release of go1.27rc1
          # - runner: windows-2025
          #   canary: true
    with:
      timeout: 45
      runner: ${{ matrix.runner }}
      binary: ${{ matrix.binary != '' && matrix.binary || 'nerdctl' }}
      canary: ${{ matrix.canary && true || false }}
      # Hyper-V is broken on canary.
      # [v2.3.0-beta.2 regression] The virtual machine or container JSON document is invalid. (Hyper-V container)
      # https://github.com/containerd/containerd/issues/13254
      no-hyperv: ${{ matrix.canary && true || false }}
      go-version: 1.26
      windows-cni-version: v0.3.3
      docker-version: 5:29.8.2-1~ubuntu.26.04~resolute
      windows-containerd-version: 2.4.1
      windows-containerd-sha: 57ebdac7c130dc6d17869c261325ae4282362304a6d38a2503de9da5524a4a05
